services:
  - type: web
    name: weather-data-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_TYPE
        value: sqlite
      - key: LOG_LEVEL
        value: INFO
